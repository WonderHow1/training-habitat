<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练栖地｜介绍片方向预览</title>
<style>
:root{color-scheme:light;--sans:"PingFang SC","Hiragino Sans GB",sans-serif;--serif:"Songti SC","STSong",serif}
*{box-sizing:border-box}
body{margin:0;background:#f5f5ef;color:#18211d;font-family:var(--sans)}
main{width:100%;max-width:1600px;margin:auto;padding:38px 46px 32px}
header{display:flex;align-items:end;justify-content:space-between;gap:32px;margin-bottom:24px}
header p{margin:0;font-size:17px;max-width:620px;line-height:1.55;color:#404940}
h1{font-size:48px;margin:0;line-height:1.1;letter-spacing:-.055em}
.mark{font-size:15px;font-weight:650;margin-bottom:9px;display:flex;align-items:center;gap:9px}
.mark img{width:22px;height:22px;border-radius:5px}
nav{display:flex;gap:19px;margin:0 0 23px;border-bottom:1px solid #c9ccc3;padding:0 0 12px}
nav a{color:#334237;text-decoration:none;font-size:16px}
nav a[aria-current]{color:#174b38;text-decoration:underline;text-underline-offset:5px;font-weight:750}
a:focus-visible{outline:2px solid #174b38;outline-offset:4px}
.detail,.overview{display:grid;gap:14px}
.detail{grid-template-columns:2fr 1fr;align-items:start}
.detail .hero{grid-row:span 2}
.overview{grid-template-columns:repeat(3,1fr);gap:18px 14px}
.meta{display:flex;justify-content:space-between;align-items:flex-start;gap:25px;margin-top:20px}
.meta p{font-size:15px;line-height:1.5;margin:0;max-width:850px}
.swatches{display:flex;gap:0;margin-top:3px;min-width:max-content}
.swatches i{width:31px;height:21px;border:1px solid #18211d30;background:var(--sample)}
.swatches i+i{border-left:0}
figure{margin:0;min-width:0}
figcaption{margin-top:7px;font-size:14px;font-weight:650;white-space:normal}
.framebox{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;container-type:inline-size}
.frame{position:absolute;inset:0 auto auto 0;width:960px;height:540px;overflow:hidden;transform:scale(calc(100cqw / 960px));transform-origin:top left;background:var(--bg);color:var(--fg);isolation:isolate}
.frame h2,.frame p{margin:0}
.frame h2{font-weight:800;line-height:1.08;letter-spacing:-.07em}
.frame p{font-weight:550;font-size:23px;line-height:1.4}
.frame img{display:block}
.screen{position:absolute;overflow:hidden;border:6px solid #121b22;border-radius:33px;box-shadow:0 14px 35px #12282938;background:#141b20}
.screen img{width:100%;height:100%;object-fit:fill}
.art,.sprite{image-rendering:pixelated}
.sprite{object-fit:contain;object-position:center bottom}
.copy{position:absolute;z-index:2}
.line{position:absolute;height:1px;background:currentColor;opacity:.32}
.a{--bg:#dfecd1;--fg:#142b1a}
.a .copy{left:58px;top:53px}
.a h2{font-size:75px}
.a .case{font-size:20px;margin-bottom:12px}
.a .schedule{position:absolute;z-index:2;left:62px;top:307px;width:522px;border-top:1px solid #547457;border-bottom:1px solid #547457}
.schedule div{display:grid;grid-template-columns:132px 1fr 176px;align-items:center;min-height:51px;font-size:21px;font-weight:600;border-bottom:1px solid #87a487}
.schedule div:last-child{border:0}
.schedule strong{text-align:right;font-weight:730}
.schedule .changed strong{color:#822f27}
.a .screen{width:211px;height:454px;right:72px;top:44px;transform:rotate(5deg)}
.a .tail{position:absolute;bottom:49px;left:62px;font-size:18px}
.a2{--bg:#24392c;--fg:#eff5e5}
.a2 .copy{left:56px;top:89px}
.a2 h2{font-size:79px}
.a2 p{margin-top:25px}
.a2 .screen{width:208px;height:437px;right:104px;top:49px}
.a2 .line{left:57px;width:387px;top:382px}
.a3{--bg:#e5ecdc;--fg:#1f3727}
.a3 .copy{left:63px;top:73px}
.a3 h2{font-size:73px}
.a3 p{margin-top:25px}
.a3 .sprite{position:absolute;width:176px;height:176px;right:72px;top:154px}
.a3 .line{left:60px;width:840px;top:380px}
.a3 .question{position:absolute;left:65px;top:417px}
.b{--bg:#cbe2f6;--fg:#142d3f}
.b .art{position:absolute;right:0;top:0;width:550px;height:100%;object-fit:cover;object-position:center 54%;mask-image:linear-gradient(to right,transparent,black 28%)}
.b .copy{left:59px;top:73px}
.b h2{font-size:83px}
.b p{margin-top:23px}
.b .sprite{position:absolute;width:224px;height:238px;left:460px;bottom:52px;filter:drop-shadow(0 9px 0 #142e4050)}
.b .screen{width:160px;height:341px;right:33px;top:135px;border-width:5px;border-radius:25px;transform:rotate(-5deg)}
.b2{--bg:#faf0d9;--fg:#3b3229}
.b2 .copy{left:55px;top:49px}
.b2 h2{font-size:70px}
.b2 p{margin-top:12px}
.b2 .stages{display:flex;gap:52px;position:absolute;left:57px;right:57px;bottom:58px;justify-content:space-around;border-bottom:1px solid #ad8f6f;padding-bottom:13px}
.b2 .stages div{width:185px;display:grid;justify-items:center;gap:16px;grid-template-rows:138px auto;align-items:end;font-weight:730;font-size:20px}
.b2 .sprite{width:auto;height:102px}
.b2 .stages div:nth-child(2) .sprite{height:126px}
.b2 .stages div:nth-child(3) .sprite{height:138px}
.b3{--bg:#a4c987;--fg:#20351d}
.b3 .copy{left:65px;top:156px}
.b3 h2{font-size:75px}
.b3 p{margin-top:23px}
.b3 .screen{width:188px;height:403px;right:150px;top:57px;transform:rotate(-6deg)}
.b3 .screen+.screen{right:48px;top:82px;transform:rotate(7deg)}
.c{--bg:#111e2e;--fg:#f2f7ff}
.c .copy{left:64px;top:127px}
.c h2{font-size:87px}
.c p{margin-top:22px;color:#d3e3fa}
.c .screen{width:214px;height:461px;right:114px;top:40px;transform:rotate(-8deg)}
.c .orb{position:absolute;width:580px;height:580px;top:-34px;right:-38px;background:radial-gradient(ellipse,#3b5873 0%,transparent 68%);z-index:-1}
.c2{--bg:#e0eaf5;--fg:#172b44}
.c2 .copy{left:56px;top:110px}
.c2 h2{font-size:71px}
.c2 p{margin-top:22px}
.c2 .screen{width:236px;height:507px;right:73px;top:31px}
.c2 .line{top:385px;left:58px;width:430px}
.c3{--bg:#18342d;--fg:#edf8f1}
.c3 .copy{left:54px;top:99px}
.c3 h2{font-size:75px}
.c3 p{margin-top:24px}
.c3 .screen{width:218px;height:466px;right:77px;top:42px}
.d{--bg:#ffe4cb;--fg:#542e28}
.d .copy{left:56px;top:93px}
.d h2{font-family:var(--serif);font-size:87px}
.d p{margin-top:20px}
.d .sprite{position:absolute;width:250px;height:240px;right:49px;bottom:71px}
.d .screen{width:129px;height:276px;right:252px;top:65px;transform:rotate(-7deg);border-radius:23px;border-width:4px}
.e{--bg:#eadfbc;--fg:#322919}
.e .copy{left:59px;top:76px}
.e h2{font-family:var(--serif);font-size:82px}
.e p{margin-top:20px}
.e .screen{width:205px;height:438px;right:107px;top:46px}
.e .line{top:360px;left:61px;width:424px}
.f{--bg:#bce4ed;--fg:#142d38}
.f .copy{left:62px;top:92px}
.f h2{font-size:80px}
.f p{margin-top:24px}
.f .screen{width:207px;height:442px;right:119px;top:33px;transform:rotate(-8deg)}
.f .screen+.screen{right:44px;top:96px;transform:rotate(11deg)}
@media(max-width:820px){main{padding:26px 18px}header{align-items:start;flex-direction:column;gap:10px}h1{font-size:39px}.overview{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.detail .hero{grid-row:auto}.meta{flex-wrap:wrap}nav{flex-wrap:wrap;gap:10px 16px}}
</style>
</head>

  a: ['校园一周', `<div class="copy"><p class="case">校园情境示意</p><h2>临时加课。<br>原定的跑步呢？</h2></div>
    <div class="schedule"><div class="changed"><time>周二 18:30</time><span>原定跑步 20 分钟</span><strong>临时加课</strong></div>
    <div><time>周三 18:30</time><span>跑步 20 分钟</span><strong>改期后接着练</strong></div></div>
    <p class="tail">给排过训练、也漏过练的大学生。</p>${screen('today', 'iOS 今天页面，显示训练进度和栖息地')}`],
  a2: ['计划页 · 改期', `${copy('把训练<br>挪到明天', '到「计划」长按训练项目<br>点「编辑」，改日期并保存')}<div class="line"></div>${screen('edit', 'iOS 训练计划长按菜单，显示编辑和删除')}`],
  a3: ['两周首测 · 完成率与中断后的回归', `${copy('两周后看什么？', '完成多少项原先约定的训练？')}${picture('rabbit2','青年像素兔','sprite')}<div class="line"></div><p class="question">漏练或宠物离世后，还会回来训练吗？</p>`],
  b: ['像素陪练', `${picture('track','应用内跑道栖息地素材','art')}${copy('你在训练，<br>它在长大。','把训练记录变成<br>看得见的像素成长。')}${picture('rabbit2','青年像素兔','sprite')}${screen('habitat','iOS 跑道栖息地与像素兔')}`],
  b2: ['成长镜头 · 应用内三阶段像素兔', `${copy('成长看得见','每记录满 1 分钟训练，获得 1 XP')}<div class="stages">${['幼年','青年','成年'].map((stage,i) => `<div>${picture('rabbit'+(i+1), stage+'像素兔','sprite')}<span>${stage}</span></div>`).join('')}</div>`],
  b3: ['首次使用 · 领养与选栖息地', `${copy('领养一只，<br>选个栖息地。','给自己的训练找个搭档。')}${screen('adopt','iOS 领养宠物选择页')}${screen('choose','iOS 选择栖息地页面')}`],
  c: ['实机跟练', `<div class="orb"></div>${copy('开始计时。<br>练完就记。','排计划、开练、保存训练。')}${screen('timer','iOS 训练计时页，显示暂停、结束并记录及取消计时')}`],
  c2: ['补记镜头 · 填写实际开始与结束时间', `${copy('练完忘了记？','打开「手动记录」，填写<br>实际开始和结束时间。')}<div class="line"></div>${screen('manual','iOS 手动记录表单')}`],
  c3: ['训练回顾 · 查看每一场记录', `${copy('这周练了什么？','在「回顾」查看训练分布<br>和每一场训练记录。')}${screen('review','iOS 训练回顾页面和训练分布')}`],
  d: ['备选 · 搭档日记', `${copy('今天，<br>跟它一起练。','从第一次领养到下一次训练。')}${screen('adopt','iOS 领养页面')}${picture('cat3','成年像素猫','sprite')}`],
  e: ['备选 · 设计复盘', `${copy('一次漏练之后','用两个问题检验产品假设。')}<div class="line"></div>${screen('review','iOS 训练回顾页面')}`],
  f: ['备选 · 手势剪辑', `${copy('从计划到开练','用动作串起真实的操作路径。')}${screen('today','iOS 今天页面')}${screen('timer','iOS 训练计时页')}`],
};
const directions = {
  a: {note:'先呈现课业冲突，再跟着同一场训练走完改期、计时与记录，最后回到两周首测。', motion:'让跑步时段从周二滑到周三，切到日历中实际改日期的操作。', ref:'编辑设计参照吕敬人的信息层级', colors:['#dfecd1','#24392c','#e5ecdc','#822f27']},
  b: {note:'用兔子的成长打开故事，再回到目标用户和真实训练操作。', motion:'沿像素跑道推进，切入手机中的栖息地，用真实的升阶像素帧连起三种形态。', ref:'景别参照 A Short Hike 官方预告的像素环境', colors:['#cbe2f6','#a4c987','#faf0d9','#ba795f']},
  c: {note:'从训练计时器开场，再回到学生为什么需要它，沿真实界面演示操作。', motion:'用点按位置和动作切换镜头，依次给到改期、结束并记录、手动补记与回顾。', ref:'设备构图参照 Apple Fitness+ 首发素材', colors:['#111e2e','#3b5873','#e0eaf5','#18342d']},
};
const candidateKeys = ['a','b','c','d','e','f'];
const view = new URLSearchParams(location.search).get('view');
const selected = Object.hasOwn(directions, view) ? view : 'all';
const current = directions[selected];
const boards = document.getElementById('boards');
document.getElementById('mark').insertAdjacentHTML('afterbegin', picture('icon','训练栖地 App 图标'));
document.querySelector(`[data-view="${selected}"]`).setAttribute('aria-current','page');
boards.className = current ? 'detail' : 'overview';
const sceneKeys = current ? [selected, selected+'2', selected+'3'] : candidateKeys;
boards.innerHTML = sceneKeys.map((key,index) => {
  const [label, markup] = scenes[key];
  const caption = current ? (index ? label : '主关键帧') : (index < 3 ? `${key.toUpperCase()} ${label}` : label);
  return `<figure ${current && !index ? 'class="hero"' : ''} ${current ? '' : `data-thumb="${index+1}"`}><div class="framebox"><div class="frame ${key}">${markup}</div></div><figcaption>${caption}</figcaption></figure>`;
}).join('');
if (current) {
  document.getElementById('title').textContent = `${selected.toUpperCase()}  ${scenes[selected][0]}`;
  document.getElementById('note').textContent = current.note;
  document.getElementById('meta').innerHTML = `<p>${current.motion}<br>${current.ref}。</p><div class="swatches" aria-label="方向色板">${current.colors.map(color => `<i style="--sample:${color}"></i>`).join('')}</div>`;
}
</script>
</body>
</html>
