<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练栖地｜像素宠物健身</title><style>:root {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-optical-sizing: auto;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--board-ink);
  background: var(--board);
}
button, select, input { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
svg { flex: none; display: block; }
p, h1, h2, h3, h4, figure { margin: 0; }
a { color: inherit; }
[data-theme="garden"] {
  --board: #e8eee3; --board-ink: #233d32; --board-muted: #4b6254; --board-line: #bfccbc;
  --surface: #f6f8f1; --layer: #fff; --wash: #e9f0e3; --ink: #25392e; --muted: #506154;
  --line: #d7e2d2; --accent: #285a46; --on-accent: #fff; --focus: #477b58;
  --activity: #e6eddf; --heart: #a6425a; --empty-heart: #b6a1aa;
  --hint-bg: #f8eed8; --hint-ink: #624a27; --bad-bg: #f4e0dd; --bad-ink: #8a3e3c;
  --r: 18px; --hero-font: "PingFang SC", sans-serif;
}
[data-theme="track"] {
  color-scheme: dark;
  --board: #151a2b; --board-ink: #f2efd5; --board-muted: #b6bad0; --board-line: #383e55;
  --surface: #191e30; --layer: #242a3e; --wash: #30364f; --ink: #f0eedf; --muted: #bcc1d4;
  --line: #434b64; --accent: #e5ed9f; --on-accent: #232d24; --focus: #cede8b;
  --activity: #394056; --heart: #f2a8b7; --empty-heart: #77748d;
  --hint-bg: #423b4f; --hint-ink: #f1d2b3; --bad-bg: #4c3346; --bad-ink: #ffc1c5;
  --r: 9px; --hero-font: "PingFang SC", sans-serif;
}
[data-theme="diary"] {
  --board: #eae7f2; --board-ink: #3b3157; --board-muted: #5d5276; --board-line: #cbc3dc;
  --surface: #faf8fd; --layer: #fff; --wash: #efebf8; --ink: #382d50; --muted: #59506d;
  --line: #ddd6eb; --accent: #574689; --on-accent: #fff; --focus: #755eae;
  --activity: #eee8f8; --heart: #a84363; --empty-heart: #b4a5bd;
  --hint-bg: #f9eddf; --hint-ink: #684d35; --bad-bg: #f7e6ed; --bad-ink: #8a405a;
  --r: 23px; --hero-font: "Songti SC", "Noto Serif SC", serif;
}
.board-header, .board-tools, #board, .board-footer {
  width: min(1314px, calc(100% - 88px));
  margin-inline: auto;
}
.board-header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  padding: 40px 0 24px;
  border-bottom: 1px solid var(--board-line);
}
.board-identity { display: flex; gap: 17px; align-items: center; }
.board-mark {
  width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
}
.board-mark svg { width: 31px; height: 28px; }
.board-header p { color: var(--board-muted); font-size: 14px; line-height: 1.5; }
.board-header h1 {
  font: 750 clamp(34px, 4vw, 60px)/1.08 var(--hero-font);
  letter-spacing: -.075em;
  margin-top: 4px;
}
.board-nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.board-nav a, .board-nav [aria-current] {
  text-decoration: none; font-size: 13px; padding: 9px 12px; border-radius: 20px; line-height: 1.4;
}
.board-nav [aria-current] { background: var(--accent); color: var(--on-accent); }
.board-nav a:hover { background: var(--wash); }
.board-tools {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding-block: 15px 18px;
}
.board-tools p, .board-footer p { color: var(--board-muted); font-size: 14px; line-height: 1.5; }
.board-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.board-controls label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.board-controls :is(select, input, button) {
  min-height: 36px; max-width: 100%;
  border: 1px solid var(--board-line); border-radius: 8px;
  background: var(--surface); color: var(--ink); padding: 5px 8px; font-size: 13px;
}
.board-controls button:hover { border-color: var(--board-ink); }
#demo-feedback { min-height: 1.4em; }
#board {
  display: grid;
  grid-template-columns: minmax(0, .91fr) minmax(0, 1fr) minmax(0, .91fr);
  column-gap: clamp(24px, 4vw, 68px); row-gap: 42px; align-items: start;
}
.device { min-width: 0; width: 100%; scroll-margin-top: 12px; }
.device h2 { font-size: 15px; font-weight: 650; padding-left: 3px; margin-bottom: 11px; color: var(--board-ink); }
.device[data-phone="home"] { grid-area: 1 / 2; }
.device[data-phone="week"] { grid-area: 1 / 1; margin-top: 59px; }
.device[data-phone="log"] { grid-area: 1 / 3; margin-top: 93px; }
.device[data-phone="pet"] { grid-column: 2; }
[data-theme="track"] #board { grid-template-columns: minmax(0, 1.07fr) minmax(0, .94fr) minmax(0, .91fr); }
[data-theme="track"] .board-header { align-items: center; }
[data-theme="track"] .board-mark { border-radius: 9px; }
[data-theme="track"] .device[data-phone="home"] { grid-area: 1 / 1; }
[data-theme="track"] .device[data-phone="week"] { grid-area: 1 / 2; margin-top: 24px; }
[data-theme="track"] .device[data-phone="log"] { margin-top: 49px; }
[data-theme="track"] .device[data-phone="pet"] { grid-column: 1; }
[data-theme="diary"] .board-header { padding-top: 32px; }
[data-theme="diary"] .board-mark { border-radius: 50%; }
[data-theme="diary"] #board { grid-template-columns: minmax(0, .9fr) minmax(0, 1.06fr) minmax(0, .9fr); }
[data-theme="diary"] .device[data-phone="week"] { grid-area: 1 / 3; margin-top: 66px; }
[data-theme="diary"] .device[data-phone="log"] { grid-area: 1 / 1; margin-top: 32px; }
[data-theme="diary"] .device[data-phone="pet"] { grid-column: 3; }

.board-footer { padding: 24px 0 50px; }
.board-footer p { border-top: 1px solid var(--board-line); padding-top: 16px; }

/* The supplied frame owns the status bar and safe areas. The board sets its dimensions and surface color. */
.ios-shell { display: block !important; box-shadow: 0 0 0 2px #1f2937, 0 20px 45px #141c2633 !important; }
.ios-screen { width: 100% !important; height: 704px !important; background: var(--surface) !important; color: var(--ink); }
[data-phone="home"] .ios-screen { height: 774px !important; }
.ios-content { height: 100%; }
.ios-screen > div:has(> .ios-content) { overflow: hidden !important; }

.phone-app { height: 100%; display: flex; flex-direction: column; position: relative; }
.app-scroll { flex: 1; overflow: auto; scrollbar-width: none; padding: 4px 17px 20px; }
.app-scroll::-webkit-scrollbar { display: none; }
.app-head { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.app-head h2 { font-size: clamp(25px, 2.4vw, 34px); margin: 2px 0 0; color: var(--ink); letter-spacing: -.06em; line-height: 1.16; padding: 0; }
.app-head .kicker { color: var(--muted); font-size: 13px; line-height: 1.35; }
.round {
  border: 0; border-radius: 50%; background: var(--wash); width: 39px; height: 39px;
  display: inline-grid; place-items: center; padding: 0; flex: none;
}
.round:hover, .secondary:hover, .text-button:hover { background: var(--activity); }
.tabbar { flex: none; padding: 7px 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); }
.tabbar button {
  font-size: 12px; color: var(--muted); border: 0; background: transparent; min-height: 44px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px;
}
.tabbar button:hover, .tabbar button[aria-current] { color: var(--ink); background: var(--wash); }
.tabbar button[aria-current] { font-weight: 700; }
.tabbar button[aria-current] svg { color: var(--accent); }

.habitat { background: var(--layer); border-radius: var(--r); border: 1px solid var(--line); padding: 7px 7px 11px; margin-bottom: 15px; }
.habitat-art { position: relative; overflow: hidden; border-radius: calc(var(--r) - 5px); }
.pixel-scene { display: block; width: 100%; aspect-ratio: 144 / 70; object-fit: cover; image-rendering: pixelated; }
.expanded .pixel-scene { aspect-ratio: 144 / 98; }
.scene-label {
  position: absolute; left: 9px; top: 9px; border-radius: 5px; padding: 4px 7px;
  font-size: 12px; font-weight: 650; background: var(--surface); color: var(--ink);
}
.pet-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 6px 8px; }
.pet-meta strong { font-size: 20px; font-weight: 760; letter-spacing: -.045em; }
.pet-meta span { font-size: 12px; color: var(--muted); margin-left: 7px; }
.hearts { display: flex; gap: 5px; align-items: center; }
.filled { color: var(--heart); }
.empty { color: var(--empty-heart); }
.growth { padding-inline: 6px; display: flex; align-items: center; gap: 9px; }
.growth span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.growth-bar { flex: 1; height: 7px; border-radius: 4px; overflow: hidden; background: var(--wash); }
.growth-bar i { display: block; background: var(--accent); min-height: 100%; border-radius: 4px; transition: width .2s ease; }

.today-task { padding: 13px; background: var(--layer); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 15px; }
.task-heading, .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
:is(.task-heading, .section-heading, .following, .pet-effects) h3 { font-size: 16px; font-weight: 720; letter-spacing: -.035em; }
.task-main { display: flex; align-items: center; gap: 11px; margin: 13px 0; }
.activity { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 10px; background: var(--activity); color: var(--ink); flex: none; }
.task-main h4 { font-size: 19px; letter-spacing: -.04em; line-height: 1.25; }
.task-main p { color: var(--muted); font-size: 13px; margin-top: 3px; }
.task-main p span { margin-inline: 2px; }
.task-actions, .record-actions, .sheet-buttons { display: flex; gap: 8px; }
.task-actions .primary { flex: 1; }
.primary, .secondary {
  min-height: 42px; border-radius: max(7px, calc(var(--r) - 7px)); border: 1px solid var(--line);
  display: inline-flex; gap: 7px; align-items: center; justify-content: center; padding: 6px 13px; font-weight: 670; font-size: 14px;
}
.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.primary:hover { filter: brightness(.92); }
.primary:active, .round:active, .secondary:active { transform: translateY(1px); }
.secondary { background: var(--wash); color: var(--ink); }
.full, .section-add { width: 100%; }
.following { margin-bottom: 12px; }
.following h3 { margin: 0 0 7px 2px; }
.list-row {
  border: 0; border-bottom: 1px solid var(--line); background: transparent; width: 100%; min-width: 0;
  display: flex; align-items: center; text-align: left; gap: 9px; padding: 11px 2px;
}
.list-row:hover { background: var(--wash); }
.list-copy { flex: 1; min-width: 0; }
.list-copy strong, .list-end strong { display: block; font-size: 15px; line-height: 1.35; }
.list-row small, .switch-row small, .choice small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 3px; }
.list-end { text-align: right; white-space: nowrap; font-size: 13px; }
.list-row > svg { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 20px; padding: 4px 7px; font-size: 12px; line-height: 1.1; font-weight: 670; background: var(--wash); white-space: nowrap; }
.chip i, .mark { width: 5px; height: 5px; border-radius: 50%; background: currentColor; display: inline-block; }
.chip.grace, .mark.grace { background: var(--hint-bg); color: var(--hint-ink); }
.chip.missed, .activity.missed { background: var(--bad-bg); color: var(--bad-ink); }
.chip.done, .mark.done { background: var(--accent); color: var(--on-accent); }
.notice-link {
  border: 0; border-radius: max(6px, var(--r)); background: var(--hint-bg); color: var(--hint-ink);
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; padding: 10px 12px;
}
.notice-link:hover { filter: brightness(.96); }
.notice-link strong, .notice-link small { display: block; font-size: 13px; line-height: 1.35; }
.notice-link small { font-size: 12px; margin-top: 3px; }
.empty-copy { color: var(--muted); font-size: 14px; line-height: 1.55; padding: 12px 0; }

.week-card {
  background: var(--layer); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 9px; margin-bottom: 18px;
}
.week-heading, .week-total { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
.week-heading h3 { font-size: 15px; white-space: nowrap; margin: 0; font-weight: 690; }
.week-heading .round { width: 34px; height: 34px; }
.week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; margin-block: 9px; }
.day {
  border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 5px 0 3px;
  display: grid; justify-items: center; min-width: 0; gap: 3px;
}
.day:hover, .day.actual { background: var(--wash); }
.day[aria-pressed="true"] { border-color: var(--accent); }
.day small { font-size: 12px; color: var(--muted); }
.day strong { font-size: 16px; }
.day span { min-height: 7px; display: flex; align-items: center; gap: 2px; }
.day .mark { width: 4px; height: 4px; }
.day .mark.upcoming { background: var(--muted); }
.day .mark.missed { background: var(--bad-ink); }
.day .mark.grace { background: var(--hint-ink); }
.week-total { border-top: 1px solid var(--line); padding: 9px 2px 0; }
.week-total > span { font-size: 13px; color: var(--muted); }
.week-total strong { font-size: 25px; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.week-total strong span { font-size: 16px; color: var(--muted); }
.plan-list, .pet-effects { margin-bottom: 15px; }
.text-button { border: 0; background: transparent; font-size: 13px; border-radius: 8px; padding: 7px; }
.record-actions { margin-bottom: 14px; }
.record-source { white-space: nowrap; }
.record-actions button { flex: 1; padding-inline: 5px; white-space: nowrap; }
.segments { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: var(--wash); padding: 3px; border-radius: 10px; margin-bottom: 6px; }
.segments button { min-height: 35px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; }
.segments button[aria-pressed="true"] { background: var(--layer); font-weight: 700; color: var(--ink); }
.pet-options { display: grid; gap: 8px; margin-bottom: 16px; }
.pet-effects .list-row { min-height: 58px; }

[data-theme="track"] .app-head h2 { letter-spacing: -.025em; }
[data-theme="track"] .today-task { background: var(--accent); color: var(--on-accent); border: 0; padding: 15px; }
[data-theme="track"] .today-task :is(.activity, .chip, .primary) { background: #212a28; color: #f3f4db; border-color: #212a28; }
[data-theme="track"] .today-task .secondary { background: transparent; color: inherit; border-color: #59644a; }
[data-theme="track"] .today-task p { color: #384532; }
[data-theme="track"] .task-main { margin: 23px 0 19px; }
[data-theme="track"] .task-main h4 { font-size: 24px; }
[data-theme="track"] .track-readout .habitat { display: grid; grid-template-columns: 1fr 102px; grid-template-rows: 1fr auto; padding: 10px; }
[data-theme="track"] .track-readout .habitat-art { grid-area: 1 / 2 / 3; }
[data-theme="track"] .track-readout .pixel-scene { height: 100%; aspect-ratio: auto; }
[data-theme="track"] .track-readout .scene-label { display: none; }
[data-theme="track"] .track-readout .pet-meta { display: grid; gap: 6px; align-content: center; }
[data-theme="track"] .track-readout .growth { padding-bottom: 7px; }
[data-theme="track"] .attention { margin-bottom: 15px; }
[data-theme="track"] .week-card { background: var(--wash); border-radius: 8px; }
[data-theme="track"] .week-total { flex-direction: row-reverse; justify-content: start; gap: 10px; }
[data-theme="track"] .week-total strong { font-size: 30px; color: var(--accent); }
[data-theme="track"] .day.actual { color: var(--on-accent); background: var(--accent); }
[data-theme="track"] .day.actual small { color: var(--on-accent); }
[data-theme="track"] .list-row { min-height: 62px; }

[data-theme="diary"] .app-head h2 { font-family: var(--hero-font); font-weight: 800; }
[data-theme="diary"] .diary-story { border-radius: var(--r); background: var(--layer); border: 1px solid var(--line); margin-bottom: 12px; }
[data-theme="diary"] .diary-story .habitat { border: 0; background: none; margin: 0; padding-bottom: 4px; }
[data-theme="diary"] .diary-story .pixel-scene { aspect-ratio: 144 / 68; }
[data-theme="diary"] .diary-story .habitat-art { border-radius: 17px 17px 6px 6px; }
.story-caption { font-family: "Songti SC", "Noto Serif SC", serif; font-size: 14px; padding: 7px 13px 11px; color: var(--muted); }
[data-theme="diary"] .attention { margin-bottom: 12px; }
[data-theme="diary"] .today-task { border: 0; border-radius: 0; padding: 12px 0 0; background: none; border-top: 1px solid var(--line); }
[data-theme="diary"] .today-task .activity { border-radius: 50%; }
[data-theme="diary"] .task-main h4 { font-family: var(--hero-font); font-size: 22px; }
[data-theme="diary"] .week-card { background: none; border: 0; padding-inline: 0; border-bottom: 1px solid var(--line); border-radius: 0; }
[data-theme="diary"] .week-total { border: 0; }
[data-theme="diary"] .record-feed .list-row { padding: 14px 4px; }
[data-theme="diary"] .record-feed .activity { border-radius: 50%; }

.shade { position: absolute; inset: 0; z-index: 12; display: flex; align-items: end; background: #11102366; }
.sheet {
  background: var(--layer); color: var(--ink); border-radius: 24px 24px 0 0; width: 100%;
  max-height: 96%; overflow: auto; padding: 7px 16px 18px; overscroll-behavior: contain;
}
.grab { width: 32px; height: 4px; border-radius: 5px; background: var(--line); margin: 0 auto 7px; }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 10px; }
.sheet h3 { font-size: 21px; letter-spacing: -.045em; }
.sheet header .round { width: 35px; height: 35px; }
.sheet-note { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 8px 0 12px; }
.sheet-status { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.sheet dl { font-size: 14px; margin: 6px 0 10px; }
.sheet dl div { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.sheet dl dt { color: var(--muted); }
.sheet dl dd { margin: 0; text-align: right; font-weight: 650; }
.sheet-buttons button:first-child { flex: 1; }
.field { display: grid; gap: 5px; margin-bottom: 11px; min-width: 0; font-size: 13px; }
.field span { color: var(--muted); }
.field :is(select, input) {
  width: 100%; min-width: 0; min-height: 42px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; font-size: 16px;
}
.form-pair { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 7px; }
.form-error { color: var(--bad-ink); font-size: 13px; margin-bottom: 5px; }
.project-history:empty { display: none; }
.project-history { margin: 0 0 12px; }
.project-history p { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.project-history-options { display: flex; flex-wrap: wrap; gap: 5px; }
.project-history-options .secondary { min-height: 30px; max-width: 100%; padding: 4px 9px; font-size: 12px; overflow-wrap: anywhere; }
.sheet fieldset { border: 0; margin: 0 0 10px; padding: 0; min-width: 0; }
.sheet legend { font-weight: 650; font-size: 15px; margin-bottom: 4px; padding: 0; }
.choice { display: flex; align-items: center; padding: 9px 0; gap: 6px; font-size: 14px; border-bottom: 1px solid var(--line); }
.choice span:nth-child(2) { flex: 1; }
.choice input { accent-color: var(--accent); }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; width: 100%; background: none; text-align: left; padding: 9px 0; }
.switch { width: 46px; height: 27px; border-radius: 30px; background: var(--line); padding: 3px; display: flex; align-items: center; }
.switch-row[aria-checked="true"] .switch { justify-content: end; background: var(--accent); }
.switch:before { content: ""; width: 21px; height: 21px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0003; }
.avatar { image-rendering: pixelated; width: 69px; }
.adopt-avatar { background: var(--wash); border-radius: 14px; text-align: center; }
.toast {
  position: absolute; z-index: 14; left: 16px; right: 16px; bottom: 62px; border: 1px solid var(--line);
  border-radius: 10px; padding: 11px; background: var(--ink); color: var(--surface); text-align: center; font-size: 14px;
  pointer-events: none;
}

@media (max-width: 1190px) {
  .board-header, .board-tools, #board, .board-footer { width: calc(100% - 48px); }
  #board { column-gap: 24px; }
}
@media (max-width: 1080px) {
  :is(#board, [data-theme] #board) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); max-width: 820px; }

:root:has(body[data-glass]) {

[data-glass] {

  --surface: #fff;
  --layer: #fff;

  --ink: #203550;
  --muted: #4b6078;
  --line: #e6e6e6;

  --focus: #5e5e5e;
  --activity: #f0f0f0;
  --hint-bg: #f6f6f6;

.ios-screen:has(.habitat-entry) {

  touch-action: none;
  user-select: none;
}

.heatmap {

<script>const HEATMAP_WEEKS = 52;

function sampleTrainingHistory() {
  const anchor = DEMO_AT.split('T')[0];
  const sampleTitles = ['校园夜跑', '核心训练', '下肢力量', '舒展拉伸'];
  const sampleDays = [
    [-102, 1], [-94, 2], [-86, 1], [-79, 2],
    [-74, 1], [-72, 1], [-69, 2], [-64, 1], [-60, 2], [-56, 1], [-51, 3],
    [-45, 1], [-42, 2], [-39, 1], [-35, 1], [-32, 2], [-29, 1], [-26, 1],
    [-23, 1], [-21, 2], [-19, 1], [-18, 3], [-16, 1], [-13, 2], [-10, 1], [-8, 1],
    [-350, 1], [-306, 1], [-259, 2], [-210, 1], [-178, 2], [-142, 2], [-128, 1]
  ];
  return sampleDays.flatMap(([offset, count], index) => Array.from({ length: count }, (_, session) => ({
    id: 'history-' + index + '-' + session,
    date: dayPlus(anchor, offset),
    start: ['17:50', '19:15', '21:00'][session],
    minutes: [20, 25, 15][(index + session) % 3],
    title: sampleTitles[(index + session) % sampleTitles.length],
    source: (index + session) % 3 === 0 ? 'device' : 'manual'
  })));
}

function heatmapStart(today) {
  return dayPlus(monday(today), (1 - HEATMAP_WEEKS) * 7);
}

function trainingHeatmap(records, today, selection, id) {
  const start = heatmapStart(today);
  const counts = new Map();
  let total = 0;
  for (const { date } of records) {
    if (date < start || date > today) continue;
    counts.set(date, (counts.get(date) ?? 0) + 1);
    total++;
  }

  const weeks = Array.from({ length: HEATMAP_WEEKS }, (_, week) => {
    const weekStart = dayPlus(start, week * 7);
    const month = dayPlus(weekStart, 3).slice(5, 7);
    const showMonth = week === 0 ? month === dayPlus(weekStart, 10).slice(5, 7) : month !== dayPlus(weekStart, -4).slice(5, 7);
    const cells = Array.from({ length: 7 }, (_, weekday) => {
      const date = dayPlus(weekStart, weekday);
      if (date > today) return '<span class="heat-cell heat-future" aria-hidden="true"></span>';
      const count = counts.get(date) ?? 0;
      const label = dateLabel(date) + ' · ' + count + ' 次训练';
      if (!count) return `<span class="heat-cell heat-0" title="${label}" aria-hidden="true"></span>`;
      return `<button type="button" class="heat-cell heat-${Math.min(3, count)}" data-action="log-day" data-value="${date}"
        title="${label}" aria-label="${label}" aria-pressed="${selection === date}"></button>`;
    }).join('');
    return `<div class="heat-week"><span class="heat-month">${showMonth ? Number(month) + '月' : ''}</span>${cells}</div>`;
  }).join('');

  const titleId = id + '-heatmap-title';
  return `<section class="heatmap" aria-labelledby="${titleId}">
    <header class="heatmap-head"><h3 id="${titleId}">训练热力图</h3><p>近 ${HEATMAP_WEEKS} 周 <span>·</span> <strong>${total}</strong> 次</p></header>
    <div class="heat-calendar">
      <div class="heat-week heat-weekdays" aria-hidden="true"><span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span></span></div>
      <div class="heat-weeks" tabindex="0" role="group" aria-label="训练日期，左右滚动查看更多月份">${weeks}</div>
    </div>
    <footer class="heatmap-footer">
      <p>${selection ? dateLabel(selection) + ' · ' + counts.get(selection) + ' 次' : '左右滑动 · 点日期筛选'}</p>
      ${selection ? button('查看全部日期', 'log-day', 'text-button') :
        '<div class="heat-legend" aria-label="颜色由浅到深表示训练次数由少到多"><span>少</span><i class="heat-0"></i><i class="heat-1"></i><i class="heat-2"></i><i class="heat-3"></i><span>多</span></div>'}
    </footer>
  </section>`;
}
const onboardingColors = ['#e9f2ff', '#e6f3e8', '#f5eaf9', '#fbefdf', '#fae9eb'];
const dailyGoalWarning = '每日目标超过 2 小时。请留出休息时间，避免过度训练。';

function createOnboarding(screen, { palette, speciesPicker, habitatPicker, finish }) {
  const view = document.createElement('section');
  view.className = 'onboarding';
  view.hidden = true;
  view.setAttribute('aria-label', '新用户引导');
  screen.append(view);
  let draft;
  let step;
  let color = -1;
  let timer;

  function changeColor() {
    const length = onboardingColors.length;
    color = color < 0 ? Math.floor(Math.random() * length) : (color + 1 + Math.floor(Math.random() * (length - 1))) % length;
    view.style.backgroundColor = onboardingColors[color];
  }

  function updateWarning() {
    const warning = view.querySelector('.onboarding-warning');
    if (warning) warning.textContent = Number(draft.minutes) > 120 ? dailyGoalWarning : '';
  }

  function show(index) {
    step = index;
    changeColor();
    const titles = ['设定每日训练目标', '领养宠物', '选择栖息地'];
    const contents = [
      () => `<label class="onboarding-goal"><span class="goal-caption">每日目标</span><span class="goal-entry">
        <input type="number" name="minutes" min="1" max="1440" step="1" inputmode="numeric" value="${escape(draft.minutes)}" required aria-describedby="onboarding-warning"><span>分钟</span>
      </span></label><p class="onboarding-warning" id="onboarding-warning" role="status"></p>`,
      () => speciesPicker(draft.species) + field('宠物名字', `<input name="name" value="${escape(draft.name)}" maxlength="12" required>`),
      () => `<div class="onboarding-preview habitat-choice-preview">${petCanvas(palette, 1, false, false, draft.species, draft.habitat)}</div>` + habitatPicker(draft.habitat)
    ];
    view.innerHTML = `<form class="onboarding-form">
      <header class="onboarding-head">
        <progress max="3" value="${index + 1}" aria-label="引导进度"></progress>
        <h2 tabindex="-1">${titles[index]}</h2>
      </header>
      <div class="onboarding-content">${contents[index]()}</div>
      <div class="onboarding-actions">${index ? '<button type="button" class="secondary" data-back>返回</button>' : ''}
        <button type="submit" class="primary">${index === 2 ? '开始训练' : '继续'}</button>
      </div>
    </form>`;
    view.scrollTop = 0;
    view.querySelectorAll('canvas').forEach(drawScene);
    updateWarning();
    view.querySelector('h2').focus({ preventScroll: true });
  }

  view.addEventListener('input', event => {
    const input = event.target;
    draft[input.name] = input.value;
    input.setCustomValidity('');
    updateWarning();
  });
  view.addEventListener('change', event => {
    const input = event.target;
    draft[input.name] = input.value;
    if (input.name === 'habitat') {
      const preview = view.querySelector('.onboarding-preview canvas');
      preview.dataset.habitat = input.value;
      drawScene(preview);
    }
    updateWarning();
  });
  view.addEventListener('click', event => {
    if (event.target.closest('[data-back]')) show(step - 1);
  });
  view.addEventListener('submit', event => {
    event.preventDefault();
    const data = Object.fromEntries(new FormData(event.target));
    Object.assign(draft, data);
    if (step === 1 && !draft.name.trim()) {
      const input = event.target.elements.name;
      input.setCustomValidity('请输入宠物的名字。');
      input.reportValidity();
      return;
    }
    if (step === 2) finish(draft);
    else show(step + 1);
  });

  function stop() {
    clearInterval(timer);
    view.hidden = true;
    view.innerHTML = '';
  }

  return {
    get active() { return !view.hidden; },
    start() {
      stop();
      draft = { minutes: '30', name: '团团', species: 'cat', habitat: 'garden' };
      view.hidden = false;
      show(0);
      view.scrollIntoView({ block: 'start', inline: 'nearest' });
      timer = setInterval(() => {
        if (!document.hidden && !matchMedia('(prefers-reduced-motion: reduce)').matches) changeColor();
      }, 7000);
    },
    stop
  };
}

const DAY = 86_400_000;
const DEMO_AT = '2026-11-16T20:00';
const statuses = { upcoming: '待训练', grace: '待补记', missed: '已漏练', done: '已完成' };
const tabNames = { home: '今天', week: '计划', log: '记录', pet: '宠物' };
const petSpecies = { cat: '猫', dog: '狗', rabbit: '兔子', hamster: '仓鼠' };
const habitatStyles = { garden: '草地', gym: '健身房', 'running-track': '操场跑道', living: '客厅', bedroom: '卧室' };

function bj(date, time = '00:00') {
  return Date.parse(date + 'T' + time + ':00+08:00');
}

function dateAt(time) {
  return new Date(time + 8 * 3_600_000).toISOString().slice(0, 10);
}

function dayPlus(date, count) {
  return dateAt(bj(date) + count * DAY);
}

function trainingMinutes(records, start, end = dayPlus(start, 1)) {
  return records.reduce((total, { date, minutes }) =>
    date >= start && date < end ? total + minutes : total, 0);
}

function monday(date) {
  const weekday = new Date(date + 'T00:00:00Z').getUTCDay();
  return dayPlus(date, -((weekday + 6) % 7));
}

function isoWeek(date) {
  const start = monday(date);
  const year = dayPlus(start, 3).slice(0, 4);
  const first = monday(year + '-01-04');
  return { year: Number(year), number: 1 + (bj(start) - bj(first)) / (7 * DAY) };
}

function daysInMonth(month) {
  const next = dayPlus(month + '-01', 32).slice(0, 7) + '-01';
  return Number(dayPlus(next, -1).slice(8));
}

function dateLabel(date) {
  return Number(date.slice(5, 7)) + '月' + Number(date.slice(8, 10)) + '日';
}

function deadline(plan) {
  return bj(plan.date) + DAY;
}

function stamp(time) {
  return dateLabel(dateAt(time)) + ' ' + new Date(time + 8 * 3_600_000).toISOString().slice(11, 16);
}

function seed(scenario = 'standard') {
  const add = (id, date, title, minutes) => ({ id, date: '2026-11-' + date, title, minutes, effective: bj('2026-11-09') });
  const first = add('first', '10', '核心训练', 15);
  const old = add('old', '12', '校园夜跑', 20);
  const grace = add('grace', '15', '舒展拉伸', 15);
  const today = add('today', '16', '校园夜跑', 20);
  const next = add('next', '19', '下肢力量', 30);
  const last = add('last', '21', '舒展拉伸', 15);
  const state = {
    now: bj(...DEMO_AT.split('T')),
    reminders: true,
    plans: [first, old, grace, today, next, last],
    records: [
      { id: 'sample-walk', date: '2026-11-14', start: '16:12', minutes: 24, title: '户外跑步', source: 'device' },
      { id: 'sample-stretch', date: '2026-11-13', start: '21:10', minutes: 12, title: '舒展拉伸', source: 'manual' },
      {
      id: 'sample', date: first.date, start: '18:40', minutes: 18, title: first.title,
      source: 'manual', plan: first.id
    }],
    pets: [{ id: 'moss', name: '团团', spans: [[bj('2026-11-09'), null]], born: '2026-11-09' }],
    active: 'moss',
    finished: { first: { at: bj(first.date, '19:00'), pet: 'moss', record: 'sample' } },
    misses: {},
    serial: 1
  };
  if (scenario === 'death') {
    state.plans.push(add('miss2', '11', '下肢力量', 25), add('miss3', '13', '核心训练', 15));
  }
  if (scenario === 'onboarding') {
    Object.assign(state, { plans: [], records: [], pets: [], active: null, finished: {} });
  }
  refresh(state);
  return state;
}

function petAt(state, time) {
  return state.pets.find(pet => pet.spans.some(([start, end]) => start <= time && (end === null || time < end)))?.id ?? null;
}

function points(state, petId) {
  return Object.values(state.finished).filter(event => event.pet === petId).length;
}

function health(state, petId) {
  if (!petId) return 0;
  return Math.max(0, 3 - Object.entries(state.misses).filter(([id, pet]) => pet === petId && !state.finished[id]).length);
}

function settlePetDeath(state, at) {
  if (!state.active || health(state, state.active) > 0) return;
  const pet = state.pets.find(entry => entry.id === state.active);
  const span = pet.spans.at(-1);
  span[1] = Math.max(span[0], at);
  pet.needsRecovery = true;
  state.active = null;
}

function refresh(state, revisedAt) {
  const pending = state.plans.filter(plan => !state.finished[plan.id] && !Object.hasOwn(state.misses, plan.id) && deadline(plan) + DAY <= state.now);
  pending.sort((a, b) => deadline(a) - deadline(b));
  for (const plan of pending) {
    const petId = petAt(state, deadline(plan));
    state.misses[plan.id] = petId;
    if (petId === state.active) settlePetDeath(state, revisedAt ?? deadline(plan) + DAY);
  }
}

function status(state, plan) {
  if (state.finished[plan.id]) return 'done';
  if (Object.hasOwn(state.misses, plan.id)) return 'missed';
  return state.now < deadline(plan) ? 'upcoming' : 'grace';
}

function changeDate(state, plan, date) {
  if (status(state, plan) !== 'upcoming' || monday(date) !== monday(plan.date) || date < dateAt(state.now)) return false;
  if (plan.date !== date) {
    plan.date = date;
    plan.effective = state.now;
  }
  return true;
}

function fitsPlan(plan, record, now) {
  if (record.date !== plan.date) return false;
  const start = bj(record.date, record.start);
  const end = start + record.minutes * 60_000;
  return Number.isFinite(end) && start >= plan.effective && end < deadline(plan) && end <= now && record.minutes >= plan.minutes;
}

function eligible(state, plan, record) {
  if (!plan || state.finished[plan.id] || record.plan || !fitsPlan(plan, record, state.now)) return false;
  return state.now < deadline(plan) + DAY || ((record.source === 'device' || Boolean(record.deviceId)) && state.now < deadline(plan) + 7 * DAY);
}

function match(state, plan, record) {
  if (!eligible(state, plan, record)) return false;
  const end = bj(record.date, record.start) + record.minutes * 60_000;
  const pet = Object.hasOwn(state.misses, plan.id) ? state.misses[plan.id] : petAt(state, end);
  state.finished[plan.id] = { at: state.now, pet, record: record.id };
  record.plan = plan.id;
  return true;
}

function saveRecord(state, input, merge = false) {
  const exact = input.deviceId && state.records.find(record => record.deviceId === input.deviceId);
  if (exact) return exact;
  if (merge) {
    const similar = similarRecord(state, input);
    if (similar) {
      similar.deviceId = input.deviceId;
      return similar;
    }
  }
  const record = { ...input, id: 'record-' + ++state.serial };
  state.records.unshift(record);
  return record;
}

function similarRecord(state, input) {
  return state.records.find(record =>
    record.source === 'manual' && record.date === input.date && record.start === input.start && record.minutes === input.minutes
  );
}

function unlinkTraining(state, record) {
  if (!record?.plan) return;
  delete state.finished[record.plan];
  delete record.plan;
  refresh(state, state.now);
  settlePetDeath(state, state.now);
}

function editPlan(state, plan, { title, date = plan?.date, minutes }) {
  if (!plan || !title || !Number.isInteger(minutes) || minutes < 1 || minutes > 1439) return false;
  if (date !== plan.date && (!Number.isFinite(bj(date)) || !changeDate(state, plan, date))) return false;
  Object.assign(plan, { title, minutes });
  const record = state.records.find(entry => entry.plan === plan.id);
  if (record && !fitsPlan(plan, record, state.now)) unlinkTraining(state, record);
  return true;
}

function editRecord(state, record, { title, date, start, minutes }) {
  const end = bj(date, start) + minutes * 60_000;
  if (!record || !title || !Number.isInteger(minutes) || minutes < 1 || minutes > 1440 || !Number.isFinite(end) || end > state.now) return false;
  Object.assign(record, { title, date, start, minutes });
  const plan = state.plans.find(entry => entry.id === record.plan);
  if (plan && !fitsPlan(plan, record, state.now)) unlinkTraining(state, record);
  return true;
}

function deletePlan(state, id) {
  const index = state.plans.findIndex(plan => plan.id === id);
  if (index < 0) return false;
  state.plans.splice(index, 1);
  const record = state.records.find(entry => entry.plan === id);
  if (record) delete record.plan;
  delete state.finished[id];
  delete state.misses[id];
  return true;
}

function deleteRecord(state, id) {
  const index = state.records.findIndex(record => record.id === id);
  if (index < 0) return false;
  const [record] = state.records.splice(index, 1);
  unlinkTraining(state, record);
  return true;
}

function switchPet(state, pet) {
  const active = state.pets.find(entry => entry.id === state.active);
  if (active) active.spans.at(-1)[1] = state.now;
  pet.spans.push([state.now, null]);
  state.active = pet.id;
}

function adopt(state, name, species = 'cat', habitat = 'garden') {
  if (state.active || !Object.hasOwn(petSpecies, species) || !Object.hasOwn(habitatStyles, habitat)) return false;
  const pet = { id: 'pet-' + ++state.serial, name, species, habitat, spans: [], born: dateAt(state.now) };
  state.pets.push(pet);
  switchPet(state, pet);
  return true;
}

function setPetHabitat(state, habitat) {
  const pet = state.pets.find(entry => entry.id === state.active);
  if (!pet || !Object.hasOwn(habitatStyles, habitat)) return false;
  pet.habitat = habitat;
  return true;
}

function recoverable(state) {
  return state.pets.filter(pet =>
    pet.id !== state.active && health(state, pet.id) > 0 &&
    (pet.needsRecovery || Object.entries(state.misses).some(([id, owner]) => owner === pet.id && state.finished[id]))
  );
}

function restore(state, petId) {
  const pet = recoverable(state).find(entry => entry.id === petId);
  if (!pet) return false;
  switchPet(state, pet);
  delete pet.needsRecovery;
  return true;
}

function paintPet(ctx, x, y, scale, level, faded, species) {
  const { pixels, colors, scarf } = petSprites[species] ?? petSprites.cat;
  const left = x + Math.floor((25 - pixels[0].length) / 2) * scale;
  const top = y + (24 - pixels.length) * scale;
  ctx.save();
  if (faded) ctx.globalAlpha = 0.32;
  pixels.forEach((row, j) => [...row].forEach((color, i) => {
    if (color === '.') return;
    ctx.fillStyle = colors[color];
    ctx.fillRect(left + i * scale, top + j * scale, scale, scale);
  }));
  if (level > 1) {
    ctx.fillStyle = '#6c6564';
    ctx.fillRect(x + 5 * scale, y + scarf * scale, 15 * scale, 2 * scale);
    ctx.fillStyle = '#f6d77d';
    ctx.fillRect(x + 5 * scale, y + scarf * scale, 14 * scale, scale);
    ctx.fillRect(x + 16 * scale, y + (scarf + 1) * scale, 3 * scale, 3 * scale);
  }
  if (level > 2) {
    ctx.fillStyle = '#8da55b';
    ctx.fillRect(x + 11 * scale, y - 2 * scale, scale, 5 * scale);
    ctx.fillRect(x + 12 * scale, y - 2 * scale, 4 * scale, 2 * scale);
  }
  ctx.restore();
}

function drawScene(canvas) {
  const ctx = canvas.getContext('2d');
  const p = palettes[canvas.dataset.palette];
  const compact = canvas.hasAttribute('data-avatar');
  const wide = canvas.hasAttribute('data-wide');
  const level = Number(canvas.dataset.level ?? 1);
  const faded = canvas.dataset.faded === 'true';
  const species = canvas.dataset.species ?? 'cat';
  const habitat = canvas.dataset.habitat ?? 'garden';
  if (!compact && habitat === 'running-track') {
    drawRunningTrack(ctx, canvas, level, faded, species);
    return;
  }
  if (!compact && habitat !== 'garden') {
    drawIndoorHabitat(ctx, canvas, habitat, level, faded, species);
    return;
  }
  if (canvas.hasAttribute('data-portrait')) {
    const petY = canvas.dataset.portrait === 'pet' ? 77 : 103;
    drawHabitatPortrait(ctx, p, level, faded, petY, canvas.hasAttribute('data-empty'), species);
    return;
  }
  const box = (x, y, w, h, fill) => { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); };
  if (compact) {
    paintPet(ctx, 4, 5, 1, level, faded, species);
    return;
  }
  box(0, 0, 144, 83, p.sky);
  box(0, 18, 144, 46, p.haze);
  const night = canvas.dataset.palette === 'track';
  if (night) {
    box(107, 8, 8, 11, '#e5d8bc');
    box(105, 10, 12, 7, '#e5d8bc');
    box(111, 7, 6, 7, p.sky);
    for (const [x, y] of [[10, 10], [27, 15], [37, 4], [69, 8], [90, 13], [132, 8]]) box(x, y, 1, 1, '#efe2b9');
  } else {
    for (const [x, y, w] of [[7, 11, 27], [63, 5, 21], [104, 14, 32]]) {
      box(x, y, w, 3, p.cloud);
      box(x + 5, y - 3, w - 10, 4, p.cloud);
      box(x + 10, y - 5, 9, 3, p.cloud);
    }
  }
  for (let x = 0; x < 144; x += 3) {
    const y = 33 - Math.round((Math.sin(x / 11) + Math.sin(x / 29)) * 4);
    box(x, y, 3, 25, p.far);
    const y2 = 40 - Math.round((Math.sin(x / 9 + 2) + Math.sin(x / 26)) * 3);
    box(x, y2, 3, 21, p.mid);
  }
  const tree = (x, y, size) => {
    box(x, y + size, size, size * 2, p.trees);
    box(x - size, y + size * 2, size * 3, size * 2, p.trees);
    box(x - size * 2, y + size * 3, size * 5, size, p.trees);
    box(x, y + size * 4, size, 3, p.turf);
  };
  [[4, 24, 4], [15, 28, 3], [25, 31, 2], [137, 24, 4], [126, 30, 3], [116, 34, 2]].forEach(([x, y, s]) => tree(x, y, s));
  box(0, 44, 144, 39, p.land);
  for (let y = 48; y < 87; y += 3) {
    const left = 109 - Math.round((y - 47) * 1.72) + (y % 8);
    box(left, y, 144 - left, 3, p.shore);
    box(left + 3, y, 144 - left, 3, p.water);
  }
  for (const [x, y, w] of [[115, 53, 13], [127, 61, 8], [106, 65, 9], [92, 72, 17], [77, 80, 14], [124, 77, 13], [139, 70, 5]]) box(x, y, w, 1, p.wave);
  for (const [x, y] of [[6, 53], [11, 69], [22, 50], [25, 76], [38, 63], [45, 51], [55, 69], [16, 80], [84, 51], [102, 44], [1, 76], [67, 76]]) {
    box(x, y, 4, 1, p.turf);
    box(x + 2, y - 2, 1, 2, p.turf);

  for (const [x, y] of [[17, 57], [30, 69], [41, 74], [45, 76], [9, 64], [51, 49], [74, 67], [92, 52]]) {
    box(x, y, 1, 3, p.trees);
    box(x - 1, y - 1, 3, 1, p.flower);
    box(x, y - 2, 1, 3, p.flower);
  }
  const x = wide ? 56 : 58;
  box(x - 4, 62, 31, 2, p.turf);
  box(x, 64, 23, 1, p.turf);
  paintPet(ctx, x, 39, 1, level, faded, species);
  if (faded) {
    box(x + 26, 54, 1, 7, p.flower);

    box(x + 32, 43, 5, 1, p.flower);
    box(x - 5, 46, 2, 2, p.flower);

}

function drawRunningTrack(ctx, canvas, level, faded, species) {
  const { width, height } = canvas;
  const portrait = canvas.hasAttribute('data-portrait');
  const horizon = Math.round(height * .39);
  const box = (x, y, w, h, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  };
  box(0, 0, width, horizon, '#cae5fb');
  box(0, horizon - 13, width, 13, '#e5f0f5');
  for (const [left, top] of [[.09, .10], [.62, .17], [.39, .27]]) {
    const x = width * left;
    const y = height * top;
    box(x, y, 20, 3, '#f9fcff');
    box(x + 4, y - 3, 11, 3, '#f9fcff');
  }
  box(0, horizon, width, height - horizon, '#88ac62');
  const standX = Math.round(width * .07);
  box(standX - 2, horizon - 14, 28, 3, '#60788d');
  box(standX, horizon - 11, 24, 11, '#99b0bc');
  box(standX + 1, horizon - 8, 21, 2, '#e0eced');
  box(standX + 3, horizon - 4, 18, 2, '#e0eced');
  const lightX = Math.round(width * .87);
  box(lightX, horizon - 23, 2, 26, '#6a8393');
  box(lightX - 4, horizon - 24, 10, 4, '#819ba9');
  box(lightX - 2, horizon - 23, 6, 2, '#fff5d9');

  for (let y = horizon; y < height; y++) {
    const depth = (y - horizon) / (height - horizon);
    const center = width * (.59 - .3 * depth * depth);
    const laneWidth = width * (.035 + .245 * depth);
    const left = center - 2 * laneWidth;
    box(left, y, Math.ceil(4 * laneWidth), 1, '#bd725f');
    for (let lane = 0; lane <= 4; lane++) {
      box(left + lane * laneWidth, y, depth > .52 ? 2 : 1, 1, '#f9eee5');
    }
    if (y % 9 === 0) box(left + laneWidth * .4, y, 2, 1, '#ca8873');
  }

  if (canvas.hasAttribute('data-empty')) return;
  const petY = portrait ? (canvas.dataset.portrait === 'pet' ? 81 : 103) : 42;
  const petX = Math.round(width * .55) - 12;
  box(petX - 2, petY + 22, 29, 2, '#885445');
  box(petX + 1, petY + 24, 23, 1, '#885445');
  paintPet(ctx, petX, petY, 1, level, faded, species);
}

function drawHabitatPortrait(ctx, p, level, faded, petY, empty, species) {
  const box = (x, y, w, h, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  };
  box(0, 0, 88, 192, p.land);
  box(0, 0, 88, 71, p.sky);
  box(0, 35, 88, 36, p.haze);
  for (const [x, y, w] of [[8, 13, 19], [59, 20, 21], [37, 42, 17]]) {
    box(x, y, w, 3, p.cloud);
    box(x + 5, y - 3, w - 10, 4, p.cloud);
  }
  for (let x = 0; x < 88; x += 2) {
    const ridge = Math.round(55 + Math.sin(x / 8) * 3 + Math.sin(x / 17) * 5);
    const near = Math.round(65 + Math.sin(x / 13 + 3) * 4);
    box(x, ridge, 2, 22, p.far);
    box(x, near, 2, 81 - near, p.mid);
  }
  for (const [x, y, size] of [[2, 57, 5], [12, 65, 3], [79, 56, 6], [70, 65, 4], [84, 73, 4]]) {
    box(x + size - 1, y, 3, size * 4, p.trees);
    box(x - 1, y + size, size * 2 + 2, size * 2, p.trees);
    box(x - 3, y + size * 2, size * 2 + 6, size, p.trees);
    box(x + size, y + size * 3, 2, size * 2, p.turf);
  }
  for (let y = 84; y < 192; y += 3) {
    const left = Math.round(73 - (y - 84) * .38 + Math.sin(y / 11) * 5);
    box(left, y, 88 - left, 3, p.shore);
    box(left + 3, y, 88 - left, 3, p.water);
    if (y % 9 === 0) box(left + 9 + y % 13, y + 1, 7 + y % 8, 1, p.wave);
  }
  for (let i = 0; i < 38; i++) {
    const y = 86 + (i * 19) % 101;
    const bank = Math.round(66 - (y - 84) * .38 + Math.sin(y / 11) * 5);
    const x = 2 + (i * 17) % bank;
    if (!empty && x > 18 && x < 51 && y > petY - 6 && y < petY + 32) continue;
    box(x, y, 3, 1, p.turf);
    box(x + 2, y - 2, 1, 2, p.turf);
